plugins { id 'com.android.application' }

android {
    namespace 'com.wangshaojie.libretv'
    compileSdk 35
    defaultConfig {
        applicationId 'com.wangshaojie.libretv'
        minSdk 18
        targetSdk 35
        versionCode 29
        versionName '2.0.24'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        resValue 'string', 'app_name', '静观 TV'
        multiDexEnabled true
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        if (System.getenv('ANDROID_KEYSTORE_FILE')) {
            release {
                storeFile file(System.getenv('ANDROID_KEYSTORE_FILE'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias 'libretv-app'
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('ANDROID_KEYSTORE_FILE')) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.returnDefaultValues = true }
    lint { abortOnError true; disable 'ObsoleteSdkInt', 'SetTextI18n', 'HardcodedText', 'ContentDescription', 'UnusedResources' }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

dependencies {
    // Android 4.3 兼容：Media3 全系硬要求 API 21，回退到 ExoPlayer 2.19.1（最后一个支持 minSdk 16 的版本）
    implementation 'com.google.android.exoplayer:exoplayer-core:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-hls:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-ui:2.19.1'
    // Dalvik 没有 ART 的自动分包，单 dex 64K 方法数上限需要 multidex 兜底
    implementation 'androidx.multidex:multidex:2.0.1'
}
